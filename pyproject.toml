[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polyglotspec"
version = "0.1.0"
description = "Statically detect API contract drift across PHP/Laravel, Python/FastAPI, and TS/Node.js"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "colorama>=0.4.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
polyglotspec = "polyglotspec.cli:main"
